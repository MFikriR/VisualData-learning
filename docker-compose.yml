services:

  app:
    build: .
    container_name: visualdata_app

    ports:
      - "8000:10000"

    volumes:
      - .:/var/www/html

    depends_on:
      - mysql

  mysql:
    image: mysql:8.0

    container_name: visualdata_mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: visualdata

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin

    container_name: visualdata_phpmyadmin

    restart: always

    depends_on:
      - mysql

    ports:
      - "8080:80"

    environment:
      PMA_HOST: mysql

volumes:
  mysql_data: